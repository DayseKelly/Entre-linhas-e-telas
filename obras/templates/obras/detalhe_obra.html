<h1>{{ obra.titulo }}</h1>

{% if obra.capa %}
    <img src="{{ obra.capa.url }}" alt="Capa de {{ obra.titulo }}" width="200">
{% endif %}

<p><strong>Autor:</strong> {{ obra.autor }}</p>
<p><strong>Resumo:</strong> {{ obra.resumo }}</p>

<a href="{% url 'editar_obra' obra.id %}">Editar obra</a>
<a href="{% url 'excluir_obra' obra.id %}">Excluir obra</a>
<a href="{% url 'listar_obras' %}">Voltar para a lista</a>
