<h1>Lista de Escolas</h1>
<a href="{% url 'criar_escola' %}">Cadastrar Nova Escola</a>
<hr>
<ul>
  {% for escola in escolas %}
    <li><strong>{{ escola.nome }}</strong> - {{ escola.cidade }}/{{ escola.estado }}</li>
  {% empty %}
    <li>Nenhuma escola cadastrada até o momento.</li>
  {% endfor %}
</ul>
